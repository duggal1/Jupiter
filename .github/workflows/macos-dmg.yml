name: macos-dmg

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/macos-dmg.yml"
      - "Purge/**"
      - "Purge.xcodeproj/**"
      - "Tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build universal macOS Release
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Purge.xcodeproj -scheme Purge -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/JupiterDerived" \
            CODE_SIGNING_ALLOWED=NO 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO clean build
          APP="$RUNNER_TEMP/JupiterDerived/Build/Products/Release/Jupiter.app"
          test -f "$APP/Contents/MacOS/Jupiter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "1.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "2"
          lipo "$APP/Contents/MacOS/Jupiter" -verify_arch arm64 x86_64
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          mkdir -p release
          hdiutil create -volname "Jupiter" -srcfolder "$APP" -ov -format UDZO release/Jupiter.dmg
          hdiutil verify release/Jupiter.dmg
          shasum -a 256 release/Jupiter.dmg
          ls -lh release/Jupiter.dmg

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jupiter-dmg
          path: release/Jupiter.dmg
          if-no-files-found: error

      - name: Publish Jupiter v1.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 > /dev/null 2>&1; then
            echo "Release v1.1.0 already exists; leaving it unchanged."
          else
            gh release create v1.1.0 release/Jupiter.dmg \
              --target "$GITHUB_SHA" \
              --title "Jupiter v1.1.0" \
              --notes "Updated native macOS cleaner with faster and more accurate scans, improved cleanup state synchronization, memory tools, background monitoring, and privileged operation handling. Universal Apple Silicon and Intel DMG. Ad-hoc signed, not notarized. On first launch, right-click the app and choose Open."
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Jupiter.dmg
          generate_release_notes: true
